[Ame handoff probe]
; Magenta means BL33 and scanout work; dark means BL33 entered but stopped.
; Reuse ame/l4t/bl31.bin; this directory's bl33.bin is the small probe.
l4t=1
boot_prefixes=/ame/handoff/
uart_port=1
sld_type=1

[Ame CPU entry probe]
; Replaces ATF with a stackless EL3 probe: backlight off proves CPU entry.
; Diagnostic deliberately halts. Power off afterward. Erista LCD only.
l4t=1
boot_prefixes=/ame/cpu-probe/
uart_port=1
sld_type=1
