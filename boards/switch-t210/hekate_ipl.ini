[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=0
autonogc=1

[Ame]
; Boot Ame through Hekate's L4T boot stack.
; Hekate loads bl31.bin and bl33.bin from boot_prefixes. Shared SC7/BPMP
; firmware belongs in bootloader/sys/l4t/. This board targets Erista/T210.
; Switchroot U-Boot scans /ame/l4t/boot.scr and uses bootm with the generated
; uImage, system.uInitrd and DTB. The uImage header carries the linked kernel
; entry; kernel_addr_r is the firmware's separate staging buffer, not that entry.
; U-Boot unwraps the signed bundle and advertises /chosen linux,initrd-start/end.
; sld_type=1 → hw_deinit(keep_display=true) → display+Host1x stay active.
l4t=1
boot_prefixes=/ame/l4t/
uart_port=1
stdout=serial,vidconsole
stderr=serial,vidconsole
sld_type=1
