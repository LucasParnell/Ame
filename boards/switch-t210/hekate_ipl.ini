[config]
autoboot=0
autoboot_list=0
bootwait=3
backlight=100
autohosoff=0
autonogc=1

[Ame]
; Boot Ame through Hekate's L4T boot stack.
; Hekate hardcodes firmware path to bootloader/sys/l4t/ — bl31.bin, bl33.bin,
; sc7entry.bin, sc7exit.bin, bpmpfw.bin (+ b01 variants for Mariko) MUST be
; placed there. boot_prefixes below ONLY affects what BL33 (U-Boot) scans
; for extlinux.conf — it does NOT redirect Hekate's firmware loader.
; U-Boot (bl33.bin) reads /ame/l4t/extlinux/extlinux.conf, loads the raw
; arm64 Image, and — because the Image header leaves flags bit 3 clear —
; relocates it to the 2 MiB-aligned DRAM base + text_offset (0x80080000),
; then enters Ame with the Linux arm64 handoff: x0=DTB, x1-x3=0, MMU off.
; The signed system bundle is supplied as a legacy ramdisk
; (INITRD /ame/boot/system.uInitrd); U-Boot unwraps it and advertises it via
; /chosen linux,initrd-start/end, which the kernel reads for the MXB.
; sld_type=1 → hw_deinit(keep_display=true) → display+Host1x stay active.
l4t=1
boot_prefixes=/ame/l4t/
kernel_addr_r=0x80080000
ramdisk_addr_r=0x92000000
uart_port=1
sld_type=1
